name: Projects Quality

on:
  pull_request:
    paths:
      - "apps/projects/**"
      - "packages/api-client/**"
      - "packages/auth/**"
      - "packages/icons/**"
      - "packages/lib/**"
      - "packages/tailwind-config/**"
      - "packages/tsconfig/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/projects-quality.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      GOOGLE_GENERATIVE_AI_API_KEY: projects-quality-placeholder
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DOMAIN: localhost
      OPENAI_API_KEY: projects-quality-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify architecture scanner
        run: |
          pnpm --filter projects architecture:test
          pnpm --filter projects architecture:check

      - name: Type-check Projects
        run: pnpm --filter projects type-check

      - name: Run Projects test suite
        run: pnpm --filter projects test -- --runInBand

      - name: Build Projects
        run: pnpm --filter projects build
