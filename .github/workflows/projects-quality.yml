name: Projects Fast Checks

on:
  pull_request:
    paths:
      - "apps/projects/**"
      - "packages/api-client/**"
      - "packages/auth/**"
      - "packages/icons/**"
      - "packages/lib/**"
      - "packages/tailwind-config/**"
      - "packages/tsconfig/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/projects-quality.yml"

concurrency:
  group: projects-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DOMAIN: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Projects dependencies
        run: pnpm --filter projects... install --frozen-lockfile

      - name: Verify Projects architecture
        run: |
          pnpm --filter projects architecture:test
          pnpm --filter projects architecture:check

      - name: Type-check Projects
        run: pnpm --filter projects type-check

      - name: Run affected Projects tests
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"

          if ! git diff --quiet "$base_sha"...HEAD -- \
            'apps/projects/jest.config.cjs' \
            'apps/projects/jest.setup.ts' \
            'apps/projects/package.json' \
            'apps/projects/tsconfig.json' \
            'packages/**' \
            'package.json' \
            'pnpm-lock.yaml' \
            'pnpm-workspace.yaml' \
            'turbo.json'; then
            pnpm --filter projects test -- --maxWorkers=50%
          else
            pnpm --filter projects test -- \
              --changedSince="$base_sha" \
              --maxWorkers=50% \
              --passWithNoTests
          fi
