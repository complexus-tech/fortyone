name: Mobile Quality

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/tailwind-config/**"
      - "packages/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/mobile-quality.yml"

concurrency:
  group: mobile-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_URL: https://api.example.invalid
      EXPO_PUBLIC_APP_URL: https://app.example.invalid
      EXPO_PUBLIC_SENTRY_DSN: ""
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install mobile dependencies
        run: pnpm --filter mobile... install --frozen-lockfile

      - name: Type-check mobile
        run: pnpm --filter mobile type-check

      - name: Lint mobile
        run: pnpm --filter mobile lint

      - name: Test mobile contracts and lifecycle
        run: pnpm --filter mobile test

      - name: Verify iOS and Android bundles
        run: pnpm --filter mobile export:verify
