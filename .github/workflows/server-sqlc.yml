name: Server SQLC

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/docs/**"
      - "packages/sdk-typescript/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/server-sqlc.yml"
      - ".github/workflows/ecs-fargate-release.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  typed-database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    env:
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fortyone_sqlc_ci?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      SQLC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fortyone_sqlc_ci?sslmode=disable
    services:
      postgres:
        # Multi-architecture digest for the PostgreSQL major used in production.
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortyone_sqlc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortyone_sqlc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        # Official Redis 7.4.11 Alpine multi-architecture index digest.
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript workspace dependencies
        run: pnpm --dir ../.. install --frozen-lockfile

      - name: Verify Go modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Validate migration manifest and operator contract
        run: make migration-check

      - name: Install pinned generation tools
        run: |
          make sqlc-bootstrap
          make oapi-bootstrap

      - name: Verify generated queries
        run: make generated-check

      - name: Build public API documentation
        run: pnpm --dir ../.. --filter docs build

      - name: Apply database migrations
        env:
          APP_DB_HOST: 127.0.0.1
          APP_DB_PORT: "5432"
          APP_DB_USER: postgres
          APP_DB_PASSWORD: postgres
          APP_DB_NAME: fortyone_sqlc_ci
          APP_DB_DISABLE_TLS: "true"
        run: go run ./cmd/api -migrate

      - name: Vet SQL against migrated PostgreSQL
        run: make sqlc-vet

      - name: Run server tests
        run: |
          make test
          make test-integration

      - name: Run Go vet
        run: go vet ./...
