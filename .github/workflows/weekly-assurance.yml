name: Weekly Assurance

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-assurance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-hermetic:
    name: Server race, fuzz, and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Run complete static analysis
        run: make quality-check

      - name: Run reachable-vulnerability and Go security scans
        run: make security-check

      - name: Scan committed files for secrets
        run: make gitleaks-check

      - name: Run the hermetic race suite
        run: make test-race

      - name: Run the bounded fuzz suite
        run: make test-fuzz

  server-database:
    name: Server database and generated contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    env:
      GOTOOLCHAIN: local
      SQLC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fortyone_sqlc_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fortyone_sqlc_ci?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: fortyone_sqlc_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortyone_sqlc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm --dir ../.. install --frozen-lockfile

      - name: Install pinned generation tools
        run: |
          make sqlc-bootstrap
          make oapi-bootstrap

      - name: Verify generated contracts
        run: make generated-check

      - name: Build public API documentation
        run: pnpm --dir ../.. --filter docs build

      - name: Apply migrations to disposable PostgreSQL
        env:
          APP_DB_DISABLE_TLS: "true"
          APP_DB_HOST: 127.0.0.1
          APP_DB_NAME: fortyone_sqlc_ci
          APP_DB_PASSWORD: postgres
          APP_DB_PORT: "5432"
          APP_DB_USER: postgres
        run: go run ./cmd/api -migrate

      - name: Vet SQL against migrated PostgreSQL
        run: make sqlc-vet

      - name: Run database and Redis integration tests
        run: make test-integration

  projects:
    name: Projects full quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DOMAIN: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Projects dependencies
        run: pnpm --filter projects... install --frozen-lockfile

      - name: Verify Projects architecture
        run: |
          pnpm --filter projects architecture:test
          pnpm --filter projects architecture:check

      - name: Lint Projects
        run: pnpm --filter projects lint

      - name: Type-check Projects
        run: pnpm --filter projects type-check

      - name: Run the complete Projects test suite
        run: pnpm --filter projects test -- --maxWorkers=50%

      - name: Build Projects
        run: pnpm --filter projects build
