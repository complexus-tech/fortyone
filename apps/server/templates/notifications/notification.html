{{define "content"}}
<h1 class="heading" style="{{emailStyle "heading"}}">{{.NotificationTitle}}</h1>
{{if .UserName}}<p style="{{emailStyle "text"}}">Hi {{.UserName}},</p>{{end}}
<div class="notification-message" style="{{emailStyle "notificationPanel"}}">{{safeHTML .NotificationMessage}}</div>
{{if .EmailIsMaya}}<p style="{{emailStyle "signature"}}"><strong>Maya</strong><br><span style="color:#72645d;font-size:14px;">Your AI agent at FortyOne</span></p>{{end}}
{{end}}
{{define "footer"}}{{if .NotificationsSettingsURL}}<p style="{{emailStyle "footerText"}}"><a href="{{.NotificationsSettingsURL}}" style="color:#72645d;text-decoration:underline;">Manage notification preferences</a></p>{{end}}{{end}}
