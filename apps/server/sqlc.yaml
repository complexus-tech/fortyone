version: "2"

overrides:
  go:
    overrides:
      - db_type: "uuid"
        engine: "postgresql"
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
      - db_type: "uuid"
        engine: "postgresql"
        nullable: true
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
          pointer: true
      - db_type: "pg_catalog.timestamptz"
        engine: "postgresql"
        go_type: "time.Time"
      - db_type: "pg_catalog.timestamptz"
        engine: "postgresql"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true
      - db_type: "timestamptz"
        engine: "postgresql"
        go_type: "time.Time"
      - db_type: "timestamptz"
        engine: "postgresql"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true
      - db_type: "pg_catalog.timestamp"
        engine: "postgresql"
        go_type: "time.Time"
      - db_type: "pg_catalog.timestamp"
        engine: "postgresql"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true
      - db_type: "timestamp"
        engine: "postgresql"
        go_type: "time.Time"
      - db_type: "timestamp"
        engine: "postgresql"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true
      - db_type: "pg_catalog.date"
        engine: "postgresql"
        go_type: "time.Time"
      - db_type: "pg_catalog.date"
        engine: "postgresql"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true
      - db_type: "date"
        engine: "postgresql"
        go_type: "time.Time"
      - db_type: "date"
        engine: "postgresql"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true

sql:
  - name: "documents"
    engine: "postgresql"
    schema: "internal/migrations"
    queries: "internal/modules/documents/repository/queries"
    strict_function_checks: true
    strict_order_by: true
    analyzer:
      database: false
    database:
      uri: "${SQLC_DATABASE_URL}"
      managed: false
    rules:
      - "sqlc/db-prepare"
    gen:
      go:
        package: "documentssql"
        out: "internal/modules/documents/repository/sqlc"
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_pointers_for_null_enum_types: true
        emit_json_tags: false
        emit_db_tags: false
        emit_enum_valid_method: true
        omit_unused_structs: true
        query_parameter_limit: 0
        initialisms:
          - "id"
          - "api"
          - "url"
          - "uri"

