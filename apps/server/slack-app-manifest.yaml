_metadata:
  major_version: 2

display_information:
  name: FortyOne
  description: Create, find, and discuss FortyOne work without leaving Slack.

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: fortyone
    always_online: true
  shortcuts:
    - name: Create a FortyOne task
      type: message
      callback_id: fortyone_create_task
      description: Turn this Slack message into a task in FortyOne.
  slash_commands:
    - command: /fortyone
      url: https://api.fortyone.app/integrations/slack/commands
      description: Create or find work in FortyOne.
      usage_hint: create [title]
      should_escape: true

oauth_config:
  redirect_urls:
    - https://api.fortyone.app/integrations/slack/setup
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history

settings:
  event_subscriptions:
    request_url: https://api.fortyone.app/integrations/slack/events
    bot_events:
      - app_mention
      - app_uninstalled
      - message.im
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://api.fortyone.app/integrations/slack/interactivity
    message_menu_options_url: https://api.fortyone.app/integrations/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
