_metadata:
  major_version: 2

display_information:
  name: FortyOne
  description: Create stories from Slack messages and ask Maya about your FortyOne work.
  long_description: |
    FortyOne brings planning and delivery into the Slack conversations where work begins.

    With FortyOne for Slack, you can:
    - Turn any Slack message into a story.
    - Choose the team, status, assignee, objective, labels, and priority.
    - Ask Maya to find stories, objectives, and work assigned to you.
    - Open every created story directly from its Slack confirmation.

    FortyOne only shows teams and work your account is allowed to access.
  background_color: "#111827"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: fortyone
    always_online: true
  shortcuts:
    - name: Create a story
      type: message
      callback_id: fortyone_create_task
      description: Turn this Slack message into a FortyOne story.
  slash_commands:
    - command: /fortyone
      url: https://api.fortyone.app/integrations/slack/commands
      description: Create a story in FortyOne.
      usage_hint: "[story title]"
      should_escape: false

oauth_config:
  redirect_urls:
    - https://api.fortyone.app/integrations/slack/setup
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
  pkce_enabled: false

settings:
  event_subscriptions:
    request_url: https://api.fortyone.app/integrations/slack/events
    bot_events:
      - app_mention
      - app_uninstalled
      - message.im
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://api.fortyone.app/integrations/slack/interactivity
    message_menu_options_url: https://api.fortyone.app/integrations/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: false
