get:
  operationId: listStories
  tags: [Stories]
  summary: List stories visible to the actor
  description: Personal access tokens are supported in this preview. The cursor is bound to this workspace, credential principal, team filter, and page size.
  x-fortyone-scope: stories:read
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/WorkspaceId
    - $ref: ../openapi.yaml#/components/parameters/Cursor
    - $ref: ../openapi.yaml#/components/parameters/PageLimit
    - name: teamId
      in: query
      required: false
      description: Restrict results to one team. Credential team restrictions still apply.
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: A page of visible stories.
      headers:
        X-Request-ID: {$ref: ../openapi.yaml#/components/headers/RequestId}
        RateLimit: {$ref: ../openapi.yaml#/components/headers/RateLimit}
        RateLimit-Policy: {$ref: ../openapi.yaml#/components/headers/RateLimitPolicy}
      content:
        application/json:
          schema: {$ref: ../openapi.yaml#/components/schemas/StoryPageResponse}
    '400': {$ref: ../openapi.yaml#/components/responses/BadRequest}
    '401': {$ref: ../openapi.yaml#/components/responses/Unauthorized}
    '403': {$ref: ../openapi.yaml#/components/responses/Forbidden}
    '429': {$ref: ../openapi.yaml#/components/responses/RateLimited}
    '500': {$ref: ../openapi.yaml#/components/responses/InternalError}
    '503': {$ref: ../openapi.yaml#/components/responses/ServiceUnavailable}
post:
  operationId: createStory
  tags: [Stories]
  summary: Create a story
  description: Creates one story with a personal access token, service-account key, or user-authorized OAuth token. The Idempotency-Key is required; an exact retry returns the original story, while reuse with different JSON bytes is rejected.
  x-fortyone-scope: stories:write
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/WorkspaceId
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../openapi.yaml#/components/schemas/CreateStoryRequest}
  responses:
    '201':
      description: The story was created, or the completed response for an exact retry was replayed.
      headers:
        X-Request-ID: {$ref: ../openapi.yaml#/components/headers/RequestId}
        RateLimit: {$ref: ../openapi.yaml#/components/headers/RateLimit}
        RateLimit-Policy: {$ref: ../openapi.yaml#/components/headers/RateLimitPolicy}
      content:
        application/json:
          schema: {$ref: ../openapi.yaml#/components/schemas/StoryResponse}
    '400': {$ref: ../openapi.yaml#/components/responses/BadRequest}
    '401': {$ref: ../openapi.yaml#/components/responses/Unauthorized}
    '403': {$ref: ../openapi.yaml#/components/responses/Forbidden}
    '409': {$ref: ../openapi.yaml#/components/responses/Conflict}
    '413': {$ref: ../openapi.yaml#/components/responses/RequestTooLarge}
    '415': {$ref: ../openapi.yaml#/components/responses/UnsupportedMediaType}
    '429': {$ref: ../openapi.yaml#/components/responses/RateLimited}
    '500': {$ref: ../openapi.yaml#/components/responses/InternalError}
    '503': {$ref: ../openapi.yaml#/components/responses/ServiceUnavailable}
