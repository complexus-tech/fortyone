get:
  operationId: listStoryComments
  tags: [Comments]
  summary: List comments
  description: Returns comments only after the personal access token's user can currently read the owning story and team. Both comments:read and stories:read are required.
  x-fortyone-scope: comments:read
  x-fortyone-scopes: [comments:read, stories:read]
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/WorkspaceId
    - $ref: ../openapi.yaml#/components/parameters/StoryId
    - $ref: ../openapi.yaml#/components/parameters/Cursor
    - $ref: ../openapi.yaml#/components/parameters/PageLimit
  responses:
    "200":
      description: A deterministic page of visible comment threads.
      headers:
        X-Request-ID: { $ref: ../openapi.yaml#/components/headers/RequestId }
        RateLimit: { $ref: ../openapi.yaml#/components/headers/RateLimit }
        RateLimit-Policy:
          { $ref: ../openapi.yaml#/components/headers/RateLimitPolicy }
      content:
        application/json:
          schema:
            { $ref: ../openapi.yaml#/components/schemas/CommentPageResponse }
    "400": { $ref: ../openapi.yaml#/components/responses/BadRequest }
    "401": { $ref: ../openapi.yaml#/components/responses/Unauthorized }
    "403": { $ref: ../openapi.yaml#/components/responses/Forbidden }
    "404": { $ref: ../openapi.yaml#/components/responses/NotFound }
    "429": { $ref: ../openapi.yaml#/components/responses/RateLimited }
    "500": { $ref: ../openapi.yaml#/components/responses/InternalError }
    "503": { $ref: ../openapi.yaml#/components/responses/ServiceUnavailable }
post:
  operationId: createStoryComment
  tags: [Comments]
  summary: Create comment
  description: Creates a comment using a personal access token or user-authorized OAuth token. clientRequestId makes retries durable without duplicate comments. The actor must still have access to the task and team on each request.
  x-fortyone-scope: comments:write
  x-fortyone-scopes: [comments:write, stories:read]
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/WorkspaceId
    - $ref: ../openapi.yaml#/components/parameters/StoryId
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../openapi.yaml#/components/schemas/CreateCommentRequest}
  responses:
    '201':
      description: The change was applied.
      content:
        application/json:
          schema: {$ref: ../openapi.yaml#/components/schemas/CommentResponse}
    '400': {$ref: ../openapi.yaml#/components/responses/BadRequest}
    '401': {$ref: ../openapi.yaml#/components/responses/Unauthorized}
    '403': {$ref: ../openapi.yaml#/components/responses/Forbidden}
    '404': {$ref: ../openapi.yaml#/components/responses/NotFound}
    '409': {$ref: ../openapi.yaml#/components/responses/Conflict}
    '413': {$ref: ../openapi.yaml#/components/responses/RequestTooLarge}
    '415': {$ref: ../openapi.yaml#/components/responses/UnsupportedMediaType}
    '429': {$ref: ../openapi.yaml#/components/responses/RateLimited}
    '500': {$ref: ../openapi.yaml#/components/responses/InternalError}
    '503': {$ref: ../openapi.yaml#/components/responses/ServiceUnavailable}
