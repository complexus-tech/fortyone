get:
  operationId: listWebhookEndpoints
  tags: [Webhooks]
  summary: List outbound webhook endpoints
  description: Requires a current workspace administrator personal access token.
  x-fortyone-scope: webhooks:manage
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/WorkspaceId
    - $ref: ../openapi.yaml#/components/parameters/Cursor
    - $ref: ../openapi.yaml#/components/parameters/PageLimit
  responses:
    "200":
      description: A page of webhook endpoints.
      headers:
        X-Request-ID: { $ref: ../openapi.yaml#/components/headers/RequestId }
        RateLimit: { $ref: ../openapi.yaml#/components/headers/RateLimit }
        RateLimit-Policy:
          { $ref: ../openapi.yaml#/components/headers/RateLimitPolicy }
      content:
        application/json:
          schema:
            {
              $ref: ../openapi.yaml#/components/schemas/WebhookEndpointPageResponse,
            }
    "400": { $ref: ../openapi.yaml#/components/responses/BadRequest }
    "401": { $ref: ../openapi.yaml#/components/responses/Unauthorized }
    "403": { $ref: ../openapi.yaml#/components/responses/Forbidden }
    "429": { $ref: ../openapi.yaml#/components/responses/RateLimited }
    "500": { $ref: ../openapi.yaml#/components/responses/InternalError }
    "503": { $ref: ../openapi.yaml#/components/responses/ServiceUnavailable }
post:
  operationId: createWebhookEndpoint
  tags: [Webhooks]
  summary: Register an outbound webhook endpoint
  description: Requires a current workspace administrator personal access token. The signing secret is returned once. HTTPS port 443 and public DNS are required.
  x-fortyone-scope: webhooks:manage
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/WorkspaceId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          {
            $ref: ../openapi.yaml#/components/schemas/CreateWebhookEndpointRequest,
          }
  responses:
    "201":
      description: The endpoint was registered and its initial signing secret is shown once.
      headers:
        X-Request-ID: { $ref: ../openapi.yaml#/components/headers/RequestId }
        RateLimit: { $ref: ../openapi.yaml#/components/headers/RateLimit }
        RateLimit-Policy:
          { $ref: ../openapi.yaml#/components/headers/RateLimitPolicy }
      content:
        application/json:
          schema:
            {
              $ref: ../openapi.yaml#/components/schemas/CreatedWebhookEndpointResponse,
            }
    "400": { $ref: ../openapi.yaml#/components/responses/BadRequest }
    "401": { $ref: ../openapi.yaml#/components/responses/Unauthorized }
    "403": { $ref: ../openapi.yaml#/components/responses/Forbidden }
    "409": { $ref: ../openapi.yaml#/components/responses/Conflict }
    "413": { $ref: ../openapi.yaml#/components/responses/RequestTooLarge }
    "415": { $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType }
    "429": { $ref: ../openapi.yaml#/components/responses/RateLimited }
    "500": { $ref: ../openapi.yaml#/components/responses/InternalError }
    "503": { $ref: ../openapi.yaml#/components/responses/ServiceUnavailable }
