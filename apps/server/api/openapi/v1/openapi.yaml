openapi: 3.1.0
info:
  title: FortyOne API
  version: 1.0.0-preview.1
  summary: Stable, developer-authenticated collaboration and integration API.
  description: |
    The `/api/v1` contract is deliberately separate from FortyOne's legacy
    first-party web and mobile routes. The authentication boundary recognizes
    personal access tokens, service-account keys, and OAuth access tokens for
    the exact `/api/v1` audience in the Authorization header, but credential
    recognition does not imply operation authorization. Every operation
    documents its supported principal and required scopes. Current preview
    reads accept a personal access token or user-authorized OAuth token. Story
    creation also supports a service-account key and preserves the calling
    principal's attribution; every other operation rejects service accounts
    with `principal_not_supported` until its resource explicitly supports them.
servers:
  - url: https://api.fortyone.app
    description: Production
security:
  - machineBearer: []
tags:
  - name: Workspaces
  - name: Teams
  - name: Stories
  - name: Comments
  - name: Labels
  - name: Workflows
  - name: Sprints
  - name: Objectives
  - name: Webhooks
paths:
  /api/v1/workspaces/{workspaceId}:
    $ref: ./paths/workspace.yaml
  /api/v1/workspaces/{workspaceId}/teams:
    $ref: ./paths/teams.yaml
  /api/v1/workspaces/{workspaceId}/stories:
    $ref: ./paths/stories.yaml
  /api/v1/workspaces/{workspaceId}/stories/{storyId}:
    $ref: ./paths/story.yaml
  /api/v1/workspaces/{workspaceId}/stories/{storyId}/comments:
    $ref: ./paths/comments.yaml
  /api/v1/workspaces/{workspaceId}/stories/{storyId}/comments/{commentId}:
    $ref: ./paths/comment.yaml
  /api/v1/workspaces/{workspaceId}/labels:
    $ref: ./paths/labels.yaml
  /api/v1/workspaces/{workspaceId}/states:
    $ref: ./paths/states.yaml
  /api/v1/workspaces/{workspaceId}/sprints:
    $ref: ./paths/sprints.yaml
  /api/v1/workspaces/{workspaceId}/objectives:
    $ref: ./paths/objectives.yaml
  /api/v1/workspaces/{workspaceId}/key-results:
    $ref: ./paths/key-results.yaml
  /api/v1/workspaces/{workspaceId}/webhook-endpoints:
    $ref: ./paths/webhook-endpoints.yaml
  /api/v1/workspaces/{workspaceId}/webhook-endpoints/{endpointId}:
    $ref: ./paths/webhook-endpoint.yaml
  /api/v1/workspaces/{workspaceId}/webhook-endpoints/{endpointId}/subscriptions:
    $ref: ./paths/webhook-subscriptions.yaml
  /api/v1/workspaces/{workspaceId}/webhook-endpoints/{endpointId}/rotate-secret:
    $ref: ./paths/webhook-rotate-secret.yaml
  /api/v1/workspaces/{workspaceId}/webhook-endpoints/{endpointId}/disable:
    $ref: ./paths/webhook-disable.yaml
components:
  securitySchemes:
    machineBearer:
      type: http
      scheme: bearer
      bearerFormat: FortyOne developer credential
      description: Personal access tokens, service-account keys, and OAuth tokens issued for the exact /api/v1 audience are accepted only in the Authorization header and never in URLs. The stable scheme name is retained for preview-client compatibility; each operation documents which principal types it authorizes.
