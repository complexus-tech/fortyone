  - generic [ref=e566]:
    - heading "What teams ask before getting started." [level=2] [ref=e568]
    - generic [ref=e569]:
      - generic [ref=e570]:
        - button "What makes FortyOne different from a task manager?" [expanded] [ref=e571] [cursor=pointer]
        - region "What makes FortyOne different from a task manager?" [ref=e577]:
          - paragraph [ref=e579]: Most task managers start after the work has already been chosen. FortyOne connects the customer request, company strategy, project documents, calendar plan, and delivery work, so the team can trace why something matters from the first signal to the finished result.
      - generic [ref=e580]:
        - button "How does customer feedback work?" [ref=e581] [cursor=pointer]
        - paragraph [ref=e587]: Customers can submit requests, vote, and comment in a public portal. Feedback boards route each request to the team that owns the work. The team can review it, close it, or turn it into planned work.
      - generic [ref=e588]:
        - button "What can FortyOne's AI do?" [ref=e589] [cursor=pointer]
        - paragraph [ref=e595]: Maya can prepare a delivery brief, suggest an owner and estimate, propose the first work window, and surface delivery risk from the project context already in FortyOne.
      - generic [ref=e596]:
        - button "Can we review AI actions before they are applied?" [ref=e597] [cursor=pointer]
        - paragraph [ref=e603]: Yes. Teams can review and edit important suggestions before they change the project plan.
      - generic [ref=e604]:
        - button "Is the free plan actually free?" [ref=e605] [cursor=pointer]
        - paragraph [ref=e611]: Yes. There is no credit card and no trial expiry. The Hobby plan supports one team and up to five members, enough to run a real sprint and decide whether FortyOne should scale with you.
      - generic [ref=e612]:
        - button "Can FortyOne plan around my team's calendar?" [ref=e613] [cursor=pointer]
        - paragraph [ref=e619]: Yes. Google Calendar meetings and FortyOne work can appear in one weekly view. Teams can schedule assigned work around existing commitments, protect focus time, and spot conflicts. When Maya auto-assignment is enabled, Maya can choose an owner and place the first work block using workload and calendar availability.
      - generic [ref=e620]:
        - button "How does FortyOne connect strategy to daily work?" [ref=e621] [cursor=pointer]
        - paragraph [ref=e627]: Start with an ultimate goal, organise the strategy into pillars, and connect each objective to measurable key results. Stories can then link to the objective and key result they support, while the roadmap shows ownership, health, progress, and dates.
      - generic [ref=e628]:
        - button "Can documents stay connected to project work?" [ref=e629] [cursor=pointer]
        - paragraph [ref=e635]: Yes. Teams can write shared project documents, attach Stories and Objectives through Related Work, and turn selected text into a new Story or Objective without losing the surrounding context.
      - generic [ref=e636]:
        - button "Which tools does FortyOne work with?" [ref=e637] [cursor=pointer]
        - paragraph [ref=e643]: FortyOne works with tools including Google Calendar, Slack, GitHub, GitLab, Figma, and Google Drive. These connections bring availability and source context into the project plan.
